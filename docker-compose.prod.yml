# =============================================================================
# Sobreposição de produção — servidores caseiros (D-112, substitui a E4.4)
#
#   docker compose -f docker-compose.yml -f docker-compose.prod.yml up -d
#
# Roda no `prod` (MacBook), em /srv/apps/flightmonitor. O banco NÃO roda aqui:
# fica no Postgres compartilhado do `lab` (Dell), alcançado pela malha
# Tailscale. A convenção dos dois servidores é essa — lab guarda os dados,
# prod roda as aplicações — e o backup diário do lab já cobre o banco novo sem
# configuração nenhuma. Ver docs/GUIA-DEPLOY.md.
#
# Sobreposição, e não um arquivo separado: duplicar o compose inteiro garante
# que as duas cópias divirjam. Aqui só aparece o que MUDA.
# =============================================================================

services:

  # O Postgres e o RabbitMQ do compose base ficam fora da produção. O perfil
  # `local` existe só para que nenhum `up` os suba por engano; ninguém o liga.
  #
  # O RabbitMQ sai junto porque o transporte segue REST (o padrão, D-087). Um
  # broker parado consumindo memória do prod, sem ninguém publicando nele, só
  # acrescentaria uma peça para cair.
  postgres:
    profiles: ["local"]

  rabbitmq:
    profiles: ["local"]

  worker:
    # O navegador nunca fala com o worker — quem fala é o core, pela rede
    # interna (regra 1 da seção 3 do PLANO-DE-ACAO).
    depends_on: !reset {}
    ports: !reset []
    environment:
      LOG_FORMAT: ecs

  core:
    depends_on: !reset {}
    ports: !reset []
    environment:
      # O IP do Tailscale do lab, e NÃO o nome: o nome do nó pode mudar
      # (renomear o lab está em pauta), o IP não. Sem valor padrão, de
      # propósito — cair no `postgres` do compose base daria um erro de DNS
      # que não fala em configuração esquecida.
      POSTGRES_HOST: ${POSTGRES_HOST:?defina POSTGRES_HOST no .env (IP do Tailscale do lab)}
      POSTGRES_PORT: 5432
      WORKER_TRANSPORTE: REST
      # Sem broker aqui, o indicador do Spring AMQP tenta conectar no `rabbitmq`
      # e derruba o /actuator/health inteiro para DOWN — a tela de Status ficaria
      # vermelha por uma peça que, com REST, ninguém usa.
      MANAGEMENT_HEALTH_RABBIT_ENABLED: "false"
      # O canário passa a valer a pena: em produção o sistema roda sem ninguém
      # olhando, que é exatamente quando uma fonte quebrada passa despercebida.
      CANARIO_ENABLED: ${CANARIO_ENABLED:-true}
      LOG_FORMAT: ecs
    volumes:
      # A chave do Firebase (D-113) é um arquivo, e não uma variável: a chave
      # privada tem quebras de linha que o .env corrompe. A pasta fica fora do
      # repositório, em /srv/apps/flightmonitor/segredos, e entra só leitura.
      - ./segredos:/run/segredos:ro
    deploy:
      resources:
        limits:
          # A JVM lê o limite do container e calcula a heap a partir dele
          # (MaxRAMPercentage=75 no Dockerfile). Sem limite, cresce até o que a
          # máquina tiver — e o prod divide a memória com outras aplicações.
          memory: 768M

  painel:
    environment:
      PAINEL_USUARIO: ${PAINEL_USUARIO:-admin}
      # SEM valor padrão, de propósito: em produção o painel não pode subir
      # aberto por esquecimento. Sem a variável, o compose recusa a subir.
      PAINEL_SENHA: ${PAINEL_SENHA:?defina PAINEL_SENHA no .env antes de subir em producao}
    ports: !override
      # Só no laço local. O Docker escreve direto no iptables e contorna o UFW:
      # sem o 127.0.0.1, a porta ficaria aberta para a LAN inteira com o
      # `ufw status` dizendo que está tudo fechado. Quem publica na internet é
      # o Tailscale Funnel, na 10000:
      #
      #   sudo tailscale funnel --bg --https=10000 8090
      - "127.0.0.1:${PAINEL_PORT:-8090}:80"
