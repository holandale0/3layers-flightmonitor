# Servidor do painel — etapa E4.2.
#
# Faz o mesmo que o proxy do `vite.config.ts` faz em desenvolvimento, e de
# proposito: o caminho que o navegador ve e o mesmo nos dois ambientes, entao
# nao ha URL para traduzir ao publicar.

server {
    listen 80;
    server_name _;

    # DNS interno do Docker, com validade curta.
    #
    # Sem isto o nginx resolve `core` UMA vez, na subida, e guarda o IP para
    # sempre. Recriar o container do core — que ganha IP novo — deixa o painel
    # devolvendo 502 ate alguem reiniciar o nginx. Aconteceu na E4.2, e o pior e
    # que o core aparecia "healthy" o tempo todo: o defeito estava em quem
    # chamava.
    #
    # O `resolver` sozinho nao basta: o nginx so re-resolve quando o destino do
    # proxy_pass e uma VARIAVEL. Dai o `set` abaixo.
    resolver 127.0.0.11 valid=10s ipv6=off;

    root /usr/share/nginx/html;
    index index.html;

    # O painel usa rotas do lado do cliente (/monitores/12). Sem este fallback,
    # recarregar a pagina numa rota dessas devolveria 404 do nginx — o arquivo
    # nao existe, quem sabe daquela rota e o JavaScript.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # O front conversa APENAS com o core-java; o worker nao e exposto ao
    # navegador. Ver regra 1 da secao 3 do PLANO-DE-ACAO.
    location /api/ {
        set $core core:8081;
        proxy_pass http://$core;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # Uma varredura manual chama as fontes externas e pode passar de um
        # minuto. Com o padrao de 60s, o painel mostraria 504 numa busca que
        # esta indo bem.
        proxy_read_timeout 180s;
    }

    # O Actuator responde na raiz, e nao sob /api — mesma separacao que o
    # `getActuator()` faz no cliente HTTP do front.
    location /actuator/ {
        set $core_actuator core:8081;
        proxy_pass http://$core_actuator;
        proxy_set_header Host $host;
    }

    # Os arquivos com hash no nome (index-BH4KO_Co.js) podem ser cacheados para
    # sempre: mudou o conteudo, muda o nome. O index.html NAO — ele e quem
    # aponta para os nomes novos, e cacheado deixaria o navegador preso numa
    # versao velha do painel.
    location ~* \.(js|css|woff2?|png|svg|jpg|jpeg|gif|ico)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    location = /index.html {
        add_header Cache-Control "no-cache";
    }

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;
}
