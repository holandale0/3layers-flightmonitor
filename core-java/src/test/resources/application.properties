# Configuracao adicional dos testes.
#
# Este arquivo NAO substitui o application.yml de src/main/resources: nomes de
# arquivo diferentes, entao os dois sao carregados e este tem precedencia sobre
# o YAML nos valores que repetir.

# ---------------------------------------------------------------- RISCO-008
# A suite roda no PROPRIO banco, e nao no de desenvolvimento — etapa E4.2.
#
# Ate aqui as duas coisas dividiam o mesmo banco (D-020), e os testes limpam as
# tabelas a cada metodo: rodar `mvn test` apagava tudo que estivesse cadastrado
# a mao. Custou dados duas vezes em dois dias, e na segunda levou o unico
# registro do numero usado no teste da E1.12 — a etapa parou ate o usuario
# informa-lo de novo.
#
# O que NAO muda: continua PostgreSQL de verdade, mesmo container, mesmo Flyway,
# mesmas migrations. O valor dos testes de constraint e trigger esta inteiro; o
# que muda e so em qual banco eles fazem a bagunca.
#
# O banco e criado por docker/postgres/init/01-banco-de-teste.sql.
spring.datasource.url=jdbc:postgresql://${POSTGRES_HOST:localhost}:${POSTGRES_PORT:5433}/${POSTGRES_TEST_DB:flightmon_test}

# Sem isto o scheduler dispararia durante a suite, consumindo cota das fontes
# reais e criando dados que quebrariam os testes seguintes. Os testes do ciclo
# chamam SearchCycleService diretamente, sem depender do relogio.
flightmonitor.scheduler.enabled=false

# Pool minusculo nos testes — etapa E3.2.
#
# A suite tem varias classes com @DynamicPropertySource e @TestPropertySource, e
# cada configuracao distinta cria um contexto Spring PROPRIO. O Spring guarda
# todos em cache ate o fim da execucao, e cada um abre o proprio pool.
#
# Com o pool de producao (10), sete contextos ja passam de 70 conexoes; somando a
# aplicacao rodando em desenvolvimento, a suite morria com
# "FATAL: sorry, too many clients already" — um erro que aponta para o banco e
# nao tem nada a ver com o teste que falhou.
#
# Dois basta: os testes rodam em uma thread so.
spring.datasource.hikari.maximum-pool-size=2
# Falhar rapido em vez de esperar dez segundos por uma conexao que nao vem.
spring.datasource.hikari.connection-timeout=5000
